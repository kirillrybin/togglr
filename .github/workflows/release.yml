name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Trusted Publishing: npm exchanges this OIDC token for a short-lived
      # publish token, so no NPM_TOKEN secret is needed at all.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Trusted Publishing needs npm >= 11.5.1; Node 22's bundled npm may be
      # older, so upgrade explicitly rather than relying on whatever ships.
      - run: npm install -g npm@latest
      - run: npm publish --provenance
